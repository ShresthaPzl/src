<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="#">Food Delivery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
          </ul>
          <form class="d-flex ms-3">
            <input class="form-control me-2" type="search" placeholder="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-4">
    <!-- Carousel -->
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/apple.jpg" class="d-block w-100" alt="Apple">
        </div>
        <div class="carousel-item">
          <img src="images/australia's own full cream milk.jpg" class="d-block w-100" alt="Milk">
        </div>
        <div class="carousel-item">
          <img src="images/bread.png" class="d-block w-100" alt="Bread">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
    <!--Ends -->

    <!-- Latest Addition Section -->
    <section class="mt-5">
      <h3 class="text-center">Our Latest Additions</h3>
      <div class="row g-4 mt-4">
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/apple.jpg" class="card-img-top" alt="Apple">
            <div class="card-body text-center">
              <h5 class="card-title">Apple</h5>
              <p>$10 per kg</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/carrots.jpg" class="card-img-top" alt="Carrot">
            <div class="card-body text-center">
              <h5 class="card-title">Carrot</h5>
              <p>$7 per kg</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/bread.png" class="card-img-top" alt="Bread">
            <div class="card-body text-center">
              <h5 class="card-title">Bread</h5>
              <p>$5 per loaf</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Ends -->

    <!-- Special & Discounted Section-->
    <section class="mt-5">
      <h3 class="text-center">Our Special & Discounted Products this week!</h3>
      <div class="row g-4 mt-4">
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/apple.jpg" class="card-img-top" alt="Apple">
            <div class="card-body text-center">
              <h5 class="card-title">Apple</h5>
              <p>$10 per kg</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/carrots.jpg" class="card-img-top" alt="Carrot">
            <div class="card-body text-center">
              <h5 class="card-title">Carrot</h5>
              <p>$7 per kg</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6">
          <div class="card">
            <img src="images/bread.png" class="card-img-top" alt="Bread">
            <div class="card-body text-center">
              <h5 class="card-title">Bread</h5>
              <p>$5 per loaf</p>
              <button class="btn btn-primary">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--Ends -->
  </main>

  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2025 Pzl - Food Delivery System</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
